# SPDX-License-Identifier: GPL-3.0-only

[project]
name = "shuttle-delegate"
version = "0.1.0"
description = "MCP server that hands bulk text work to local llama-servers"
requires-python = ">=3.11"
license = "GPL-3.0-only"
dependencies = ["mcp>=2.2"]

[dependency-groups]
dev = ["mypy>=1.18"]

[project.scripts]
shuttle-delegate = "shuttle_delegate.__main__:main"
shuttle-sweep = "shuttle_delegate.sweep:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shuttle_delegate"]

[tool.ruff]
line-length = 79

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RET", "C4"]

[tool.mypy]
strict = true

