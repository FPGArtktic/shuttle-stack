# SPDX-License-Identifier: GPL-3.0-only

[project]
name = "shuttle-delegate"
version = "0.1.0"
description = "MCP server that hands bulk text work to local llama-servers"
requires-python = ">=3.11"
license = "GPL-3.0-only"
authors = [{ name = "Mateusz Okulanis", email = "FPGArtktic@outlook.com" }]
# sqlite-vec ships the loadable extension that puts the vector half
# of the index in the same file as the lexical half.  The guidelines
# ask for a reason beyond the standard library: the alternative is a
# second service to install, back up and keep running, for an index
# that is meant to be copyable to an air-gapped machine as one file.
dependencies = ["mcp>=2.2", "sqlite-vec>=0.1.9"]

[dependency-groups]
dev = ["mypy>=1.18"]
# M7's training end, and nothing the stack runs touches it: the
# delegate stays four dependencies deep and `uv sync` stays small,
# because these five are gigabytes and only `shuttle-train` imports
# them -- lazily, inside the one function that needs a card.
train = [
  "accelerate>=1.0",
  "bitsandbytes>=0.45",
  "datasets>=3.0",
  "peft>=0.14",
  "torch>=2.5",
  "transformers>=4.48",
]

[project.scripts]
shuttle-delegate = "shuttle_delegate.__main__:main"
shuttle-sweep = "shuttle_delegate.sweep:main"
shuttle-backup = "shuttle_delegate.backup:main"
shuttle-dataset = "shuttle_delegate.dataset:main"
shuttle-train = "shuttle_delegate.train:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shuttle_delegate"]

[tool.ruff]
line-length = 79

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RET", "C4"]

[tool.mypy]
strict = true

# The training dependencies are an optional group, so a checkout that
# has not installed them is the normal case and not an error.
[[tool.mypy.overrides]]
module = [
  "accelerate.*",
  "bitsandbytes.*",
  "datasets.*",
  "huggingface_hub.*",
  "peft.*",
  "torch.*",
  "transformers.*",
]
ignore_missing_imports = true

# And the one module that imports them cannot satisfy strict mypy in
# both states at once: installed, three of their calls are untyped
# and need an ignore; absent, the same ignores are unused and strict
# mypy says so.  An ignore that is needed in one installation and
# redundant in another is what an optional dependency looks like, so
# this module alone does not warn about the redundant ones.  CI runs
# without the group and a developer who installed it runs with it;
# both have to pass.
[[tool.mypy.overrides]]
module = ["shuttle_delegate.train"]
warn_unused_ignores = false

# sqlite-vec ships no py.typed marker, so the one call into it is
# ignored at the import rather than everywhere it is used.
[[tool.mypy.overrides]]
module = "sqlite_vec"
ignore_missing_imports = true

